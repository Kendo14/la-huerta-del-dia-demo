  <head>

    />

    <meta
      name="description"
      content="Ca’n Panxa Roja · Fruta y verdura local de Mallorca, de la tierra a tu casa. Para casa y para restaurantes."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link
      rel="preload"
      as="image"
      href="./img/mascota-pie-360.webp"
      imagesrcset="./img/mascota-pie-360.webp 408w, ./img/mascota-pie-720.webp 816w"
      imagesizes="(min-width: 1024px) 400px, 200px"
    />
    <title>Ca’n Panxa Roja</title>
    <style>
      /* Pantalla de arranque: se pinta antes de que cargue JavaScript, como el splash nativo de Android.
         Crema, como la tienda y la entrada (guía de marca), con la mascota de pie. */
      html.is-booting,
      html.is-booting body {
        background: #fff8ec;
        overflow: hidden;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #fff8ec;
        color: #23492d;
        transition: opacity 0.42s ease, visibility 0.42s;
      }
      #splash .splash-mark {
        width: 168px;
        height: auto;
        transform-origin: 50% 100%;
        filter: drop-shadow(0 10px 14px rgba(28, 38, 29, 0.22));
        animation: splash-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #splash .splash-word {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(56px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      #splash .splash-name {
        margin: 0;
        font: 800 34px/1 'Panxa Display', system-ui, sans-serif;
        letter-spacing: -0.015em;
      }
      #splash .splash-name em {
        font-style: normal;
        color: #e74732;
      }
      #splash .splash-tag {
        margin: 10px 0 0;
        font: 600 13px/1.3 'Panxa Text', system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #4e5a4c;
      }
      #splash.is-ready .splash-word {
        opacity: 1;
        transform: none;
      }
      #splash.is-leaving {
        opacity: 0;
        visibility: hidden;
      }
      #splash.is-leaving .splash-mark {
        transform: scale(1.18);
        transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.82);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (min-width: 1024px) {
        #splash {
          display: none;
        }
        html.is-booting,
        html.is-booting body {
          background: #fff8ec;
          overflow: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-FzjvtaI-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DE1b6n7h.css">
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img class="splash-mark" src="./img/mascota-pie-360.webp" alt="" width="408" height="360" />
      <div class="splash-word">
        <p class="splash-name">Ca’n Panxa <em>Roja</em></p>
        <p class="splash-tag">De la tierra a tu casa</p>
      </div>
    </div>
    <script>
      // Idioma antes de cargar la app (mismo criterio que src/i18n/index.js): el lema del arranque y el lang.
      (function () {
        var lang = null;
        try { lang = localStorage.getItem('panxa:idioma'); } catch (e) {}
        if (!lang) {
          var h = window.__HUERTA__;
          var cuenta = h && h.sesion && h.sesion.cuenta;
          var prefs = navigator.languages || [navigator.language];
          lang = cuenta && cuenta.idioma ? cuenta.idioma : prefs.some(function (l) { return /^ca\b/i.test(l || ''); }) ? 'ca' : 'es';
        }
        if (lang === 'ca') {
          document.documentElement.lang = 'ca-ES';
          document.querySelector('#splash .splash-tag').textContent = 'De la terra a ca teva';
        }
      })();
    </script>
    <div id="root"></div>
    <noscript>Activa JavaScript para usar Ca’n Panxa Roja. · Activa JavaScript per utilitzar Ca’n Panxa Roja.</noscript>
  </body>
</html>
